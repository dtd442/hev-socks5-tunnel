name: Build hev-socks5-tunnel (Android)

on:
  workflow_dispatch:
  push:
    branches: ["master"]

jobs:
  android:
    name: Build Android .so
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK 29.0.14206865
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --channel=0 \
            --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Prepare build
        run: |
          # Crea link simbolico jni per ndk-build
          ln -sf . jni

      - name: Build libhev-socks5-tunnel.so
        run: |
          # Crea Application.mk con i flag personalizzati
          cat > Application.mk << 'APPMK'
          APP_OPTIM := release
          APP_PLATFORM := android-24
          APP_ABI := arm64-v8a x86_64
          APP_CFLAGS := -O3 -DPKGNAME=com/freedom/boost/services -DCLSNAME=TProxyService
          APP_CPPFLAGS := -O3 -std=c++11
          NDK_TOOLCHAIN_VERSION := clang
          APPMK

          # Compila la JNI (solo shared library, non l'eseguibile)
          $NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            APP_ABI="arm64-v8a x86_64" \
            APP_PLATFORM=android-24 \
            NDK_LIBS_OUT=./libs \
            NDK_OUT=./obj \
            -j$(nproc)

      - name: Upload libhev-socks5-tunnel.so
        uses: actions/upload-artifact@v7
        with:
          name: hev-socks5-tunnel-boost
          path: libs/**/libhev-socks5-tunnel.so
          if-no-files-found: error
          retention-days: 7